<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Ejercicios</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e293b, #0f172a); min-height: 100vh; }
        .card-menu { transition: transform 0.2s, box-shadow 0.2s; }
        .card-menu:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3) !important; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="container" style="max-width: 500px;">
        <div class="text-center text-white mb-4">
            <h2 class="fw-bold">Mis Ejercicios PHP</h2>
            <p class="text-white-50">Selecciona un ejercicio para ponerlo a prueba</p>
        </div>

        <div class="d-flex flex-column gap-3">
            
            <a href="ejercicio01.php" class="card card-menu text-decoration-none border-0 shadow-sm bg-primary text-white rounded-4 p-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-receipt fs-2 me-3"></i>
                    <div>
                        <h5 class="mb-0 fw-bold">Ejercicio 01</h5>
                        <small class="text-white-50">Descuento e Impuesto IGV[cite: 2]</small>
                    </div>
                </div>
            </a>

            <a href="ejercicio02.php" class="card card-menu text-decoration-none border-0 shadow-sm bg-success text-white rounded-4 p-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-calendar-event fs-2 me-3"></i>
                    <div>
                        <h5 class="mb-0 fw-bold">Ejercicio 02</h5>
                        <small class="text-white-50">Estaciones del Año[cite: 3]</small>
                    </div>
                </div>
            </a>

            <a href="ejercicio03.php" class="card card-menu text-decoration-none border-0 shadow-sm bg-warning text-dark rounded-4 p-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-thermometer-sun fs-2 me-3"></i>
                    <div>
                        <h5 class="mb-0 fw-bold">Ejercicio 03</h5>
                        <small class="text-dark-50">Tipo de Clima[cite: 4]</small>
                    </div>
                </div>
            </a>

            <a href="ejercicio04.php" class="card card-menu text-decoration-none border-0 shadow-sm bg-info text-dark rounded-4 p-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-grid-3x3-gap fs-2 me-3"></i>
                    <div>
                        <h5 class="mb-0 fw-bold">Ejercicio 04</h5>
                        <small class="text-dark-50">Precio por Calidad[cite: 5]</small>
                    </div>
                </div>
            </a>

            <a href="ejercicio05.php" class="card card-menu text-decoration-none border-0 shadow-sm bg-danger text-white rounded-4 p-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-arrow-repeat fs-2 me-3"></i>
                    <div>
                        <h5 class="mb-0 fw-bold">Ejercicio 05</h5>
                        <small class="text-white-50">Positivos y Negativos (Bucles)[cite: 6]</small>
                    </div>
                </div>
            </a>

        </div>
